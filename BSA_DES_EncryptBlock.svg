<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1693" viewBox="0 0 1000 1693">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="black" stroke-width="1.2"/></marker></defs>
<rect x="240" y="17" width="520" height="88" rx="44" fill="white" stroke="black" stroke-width="2"/>
<text x="500" y="68.0" text-anchor="middle" font-family="Arial" font-size="22">НАЧАЛО</text>
<polygon points="265,135 760,135 735,223 240,223" fill="white" stroke="black" stroke-width="2"/>
<text x="500" y="186.0" text-anchor="middle" font-family="Arial" font-size="22">64-битовый блок B; подключи K[0..15]</text>
<rect x="240" y="240" width="520" height="88" rx="0" fill="white" stroke="black" stroke-width="2"/>
<text x="500" y="291.0" text-anchor="middle" font-family="Arial" font-size="22">V ← IP(B); L ← старшие 32 бита</text>
<rect x="240" y="345" width="520" height="88" rx="0" fill="white" stroke="black" stroke-width="2"/>
<text x="500" y="396.0" text-anchor="middle" font-family="Arial" font-size="22">R ← младшие 32 бита; i ← 0</text>
<polygon points="500,450 760,494 500,538 240,494" fill="white" stroke="black" stroke-width="2"/>
<text x="500" y="501.0" text-anchor="middle" font-family="Arial" font-size="18">i &lt; 16?</text>
<rect x="240" y="565" width="520" height="88" rx="0" fill="white" stroke="black" stroke-width="2"/>
<text x="500" y="616.0" text-anchor="middle" font-family="Arial" font-size="22">j ← i</text>
<rect x="240" y="670" width="520" height="88" rx="0" fill="white" stroke="black" stroke-width="2"/>
<text x="500" y="721.0" text-anchor="middle" font-family="Arial" font-size="22">U ← E(R) XOR K[j]</text>
<rect x="240" y="775" width="520" height="88" rx="0" fill="white" stroke="black" stroke-width="2"/>
<text x="500" y="826.0" text-anchor="middle" font-family="Arial" font-size="22">Разбить U на восемь 6-битовых групп</text>
<rect x="240" y="880" width="520" height="88" rx="0" fill="white" stroke="black" stroke-width="2"/>
<text x="500" y="917.5" text-anchor="middle" font-family="Arial" font-size="22">Для каждой u: row ← ((u &gt;&gt; 4) AND 2) OR (u</text>
<text x="500" y="944.5" text-anchor="middle" font-family="Arial" font-size="22">AND 1); col ← (u &gt;&gt; 1) AND 15</text>
<rect x="240" y="985" width="520" height="88" rx="0" fill="white" stroke="black" stroke-width="2"/>
<text x="500" y="1036.0" text-anchor="middle" font-family="Arial" font-size="22">S ← S₁[row,col] || … || S₈[row,col]</text>
<rect x="240" y="1090" width="520" height="88" rx="0" fill="white" stroke="black" stroke-width="2"/>
<text x="500" y="1141.0" text-anchor="middle" font-family="Arial" font-size="22">F ← P(S); (L, R) ← (R, L XOR F)</text>
<rect x="240" y="1195" width="520" height="88" rx="0" fill="white" stroke="black" stroke-width="2"/>
<text x="500" y="1246.0" text-anchor="middle" font-family="Arial" font-size="22">i ← i + 1</text>
<rect x="240" y="1363" width="520" height="88" rx="0" fill="white" stroke="black" stroke-width="2"/>
<text x="500" y="1414.0" text-anchor="middle" font-family="Arial" font-size="22">V ← R || L; B* ← IP⁻¹(V)</text>
<polygon points="265,1468 760,1468 735,1556 240,1556" fill="white" stroke="black" stroke-width="2"/>
<text x="500" y="1519.0" text-anchor="middle" font-family="Arial" font-size="22">Преобразованный 64-битовый блок B*</text>
<rect x="240" y="1588" width="520" height="88" rx="44" fill="white" stroke="black" stroke-width="2"/>
<text x="500" y="1639.0" text-anchor="middle" font-family="Arial" font-size="22">КОНЕЦ</text>
<polyline points="500,105 500,135" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="500,223 500,240" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="500,328 500,345" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="500,433 500,450" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="500,538 500,565" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<text x="530" y="560.0" text-anchor="start" font-family="Arial" font-size="22" font-weight="bold">Да</text>
<polyline points="500,653 500,670" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="500,758 500,775" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="500,863 500,880" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="500,968 500,985" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="500,1073 500,1090" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="500,1178 500,1195" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="500,1451 500,1468" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="500,1556 500,1588" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="500,1283 500,1307 160,1307 160,494 240,494" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="760,494 825,494 825,1331 500,1331 500,1363" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<text x="782" y="484.0" text-anchor="start" font-family="Arial" font-size="22" font-weight="bold">Нет</text>
</svg>